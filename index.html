  <script>
    (function () {
      "use strict";
      const storageKey = "ti-fantasy-language";
      let language = null;

      try {
        const saved = localStorage.getItem(storageKey);
        if (saved === "zh" || saved === "en") language = saved;
      } catch (error) {
        // localStorage can be unavailable in privacy-restricted contexts.
      }

      if (!language) {
        const preferred = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
        language = String(preferred).toLowerCase().startsWith("zh") ? "zh" : "en";
        try {
          localStorage.setItem(storageKey, language);
        } catch (error) {
          // Continue with the detected language even if it cannot be saved.
        }
      }

      window.__TI_FANTASY_LANGUAGE__ = language;
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
    })();
  </script>

  <script>window.FANTASY_LEAGUES = [];</script>
  <script>
    document.write(
      '<script src="data/leagues.js?v=' + Date.now() + '"><\/script>',
    );
  </script>
  <script>
    const FANTASY_LEAGUES = Array.isArray(window.FANTASY_LEAGUES)
      ? window.FANTASY_LEAGUES.filter((league) => (
          Number.isInteger(Number(league?.leagueId)) &&
          String(league?.leagueName || "").trim()
        ))
      : [];
    const leagueIds = new Set(
      FANTASY_LEAGUES.map((league) => Number(league.leagueId)),
    );
    const requestedLeagueId = Number(
      new URLSearchParams(window.location.search).get("league"),
    );
    const fallbackLeagueId = leagueIds.has(19785)
      ? 19785
      : Number(FANTASY_LEAGUES[0]?.leagueId);
    const LEAGUE_ID = leagueIds.has(requestedLeagueId)
      ? requestedLeagueId
      : fallbackLeagueId;
    window.FANTASY_LEAGUE_CONFIG = {
      leagueId: LEAGUE_ID,
      leagues: FANTASY_LEAGUES,
    };

    const leagueSelect = document.getElementById("league-select");
    let activeLeagueId = LEAGUE_ID;
    let leagueLoadSequence = 0;
    const isTheInternationalLeague = (league) => (
      /\bThe International 20\d{2}\b/i.test(String(league?.leagueName || ""))
    );
    function updateLeagueSelectAppearance(leagueId) {
      const selectedLeague = FANTASY_LEAGUES.find(
        (league) => Number(league.leagueId) === Number(leagueId),
      );
      leagueSelect.classList.toggle(
        "is-the-international",
        isTheInternationalLeague(selectedLeague),
      );
    }
    for (const league of FANTASY_LEAGUES) {
      const option = document.createElement("option");
      option.value = String(league.leagueId);
      option.textContent = league.leagueName;
      option.selected = Number(league.leagueId) === LEAGUE_ID;
      option.classList.toggle(
        "league-option--the-international",
        isTheInternationalLeague(league),
      );
      leagueSelect.append(option);
    }
    updateLeagueSelectAppearance(LEAGUE_ID);

    function setLeagueLoading(loading) {
      leagueSelect.disabled = loading;
      if (loading) {
        leagueSelect.setAttribute("aria-busy", "true");
      } else {
        leagueSelect.removeAttribute("aria-busy");
      }
    }

    function loadLeagueData(leagueId, updateHistory = true) {
      if (!leagueIds.has(leagueId) || leagueId === activeLeagueId) return;
      const sequence = ++leagueLoadSequence;
      const previousDataset = window.FANTASY_DATA;
      const previousStageDatasets = window.FANTASY_STAGE_DATA;
      const dataScript = document.createElement("script");
      dataScript.src = `data/${leagueId}/data.js?v=${Date.now()}`;
      dataScript.async = true;
      setLeagueLoading(true);

      function restorePreviousLeague() {
        if (sequence !== leagueLoadSequence) return;
        window.FANTASY_DATA = previousDataset;
        window.FANTASY_STAGE_DATA = previousStageDatasets;
        leagueSelect.value = String(activeLeagueId);
        updateLeagueSelectAppearance(activeLeagueId);
        setLeagueLoading(false);
        dataScript.remove();
      }

      dataScript.addEventListener("error", restorePreviousLeague, { once: true });
      dataScript.addEventListener("load", () => {
        const nextDataset = window.FANTASY_DATA;
        const nextStageDatasets = (
          Number(window.FANTASY_STAGE_DATA?.meta?.leagueId) === leagueId
            ? window.FANTASY_STAGE_DATA
            : null
        );
        if (Number(nextDataset?.meta?.leagueId) !== leagueId) {
          restorePreviousLeague();
          return;
        }
        if (sequence !== leagueLoadSequence) {
          dataScript.remove();
          return;
        }

        activeLeagueId = leagueId;
        window.FANTASY_LEAGUE_CONFIG.leagueId = leagueId;
        leagueSelect.value = String(leagueId);
        updateLeagueSelectAppearance(leagueId);
        setLeagueLoading(false);
        dataScript.remove();

        if (updateHistory) {
          const target = new URL(window.location.href);
          target.searchParams.set("league", String(leagueId));
          window.history.pushState({ leagueId }, "", target);
        }
        window.dispatchEvent(new CustomEvent("fantasy:leaguechange", {
          detail: {
            dataset: nextDataset,
            stageDatasets: nextStageDatasets,
            leagueId,
          },
        }));
      }, { once: true });
      document.head.append(dataScript);
    }

    leagueSelect.addEventListener("change", () => {
      loadLeagueData(Number(leagueSelect.value));
    });
    window.addEventListener("popstate", () => {
      const requestedLeagueId = Number(
        new URLSearchParams(window.location.search).get("league"),
      );
      const leagueId = leagueIds.has(requestedLeagueId)
        ? requestedLeagueId
        : fallbackLeagueId;
      loadLeagueData(leagueId, false);
    });

    if (Number.isInteger(LEAGUE_ID)) {
      document.write(
        '<script src="data/' + LEAGUE_ID + '/data.js?v=' + Date.now() + '"><\/script>',
      );
    }
  </script>
