<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090704">
  <title>Calculator for DOTA 2 TI Fantasy</title>
  <meta name="description" content="An open-source calculator for DOTA 2 TI Fantasy predictions.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Calculator for DOTA 2 TI Fantasy">
  <meta property="og:description" content="An open-source calculator for DOTA 2 TI Fantasy predictions.">
  <script>
    (function () {
      "use strict";
      const storageKey = "ti-fantasy-language";
      const previousVisitKeys = [
        storageKey,
        "ti-fantasy-page-state-v1",
        "ti-fantasy-scoring-change-notice-v1",
        "ti-fantasy-visited-v1",
      ];
      let language = null;
      let returningVisitor = false;

      try {
        returningVisitor = previousVisitKeys.some(
          (key) => localStorage.getItem(key) !== null,
        );
        const saved = localStorage.getItem(storageKey);
        if (saved === "zh" || saved === "en") language = saved;
      } catch (error) {
        // localStorage can be unavailable in privacy-restricted contexts.
      }

      if (!language) {
        const preferred = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
        language = String(preferred).toLowerCase().startsWith("zh") ? "zh" : "en";
        try {
          localStorage.setItem(storageKey, language);
        } catch (error) {
          // Continue with the detected language even if it cannot be saved.
        }
      }

      window.__TI_FANTASY_LANGUAGE__ = language;
      window.__TI_FANTASY_RETURNING_VISITOR__ = returningVisitor;
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20260804-info-modal-type">
</head>
<body>
  <aside class="correction-banner" id="correction-banner" role="status" hidden>
    <button
      type="button"
      class="correction-banner-open"
      id="scoring-change-notice-open"
      aria-label="查看 2025 与 2026 积分规则变化"
      data-i18n-aria-label="openScoringChangeNotice"
      data-i18n="scoringChangeNotice"
    >温馨提示：请注意今年积分规则的改变。</button>
    <button
      type="button"
      class="correction-banner-close"
      id="correction-banner-close"
      aria-label="关闭积分规则变化提示"
      data-i18n-aria-label="closeScoringChangeNotice"
    >×</button>
  </aside>
  <div class="fantasy-app">
    <div class="page-shell" id="page-shell">
      <header class="topbar" id="challenge">
        <div class="brand">
          <strong data-i18n="brandName">梦幻挑战</strong>
          <div
            class="stage-switcher"
            id="stage-switcher"
            role="group"
            aria-label="赛事阶段"
            data-i18n-aria-label="stageSwitcher"
          >
            <button
              type="button"
              class="is-active"
              data-stage="groupStage"
              aria-pressed="true"
            >Group Stage</button>
            <button
              type="button"
              data-stage="international"
              aria-pressed="false"
            >The International</button>
          </div>
          <div
            class="stage-switcher multiplier-switcher"
            id="multiplier-switcher"
            role="group"
            aria-label="徽标倍率方式"
            data-i18n-aria-label="multiplierSwitcher"
          >
            <button
              type="button"
              class="is-active"
              data-multiplier-mode="calculated"
              aria-pressed="true"
              data-i18n="calculatedMultiplier"
            >品质与特性</button>
            <button
              type="button"
              data-multiplier-mode="manual"
              aria-pressed="false"
              data-i18n="manualMultiplier"
            >手动倍率</button>
          </div>
        </div>

        <div class="challenge-title">
          <img
            class="event-script"
            src="fantasy-assets/ti26_script_png.png"
            alt="The International"
          >
          <div class="subtitle-row">
            <h1 data-i18n="pageHeading">开源的 Dota 2 梦幻挑战计算器</h1>
            <span class="accuracy-note" data-i18n="accuracyNote">计算结果可能不准确，数据仅供参考。</span>
          </div>
          <div
            class="advisor-titles"
            role="group"
            aria-label="指导员称号"
            data-i18n-aria-label="advisorTitles"
          >
            <label>
              <span data-i18n="prefixTitle">前缀</span>
              <select id="prefix-title-select" aria-label="前缀" data-i18n-aria-label="prefixTitle"></select>
            </label>
            <label>
              <span data-i18n="suffixTitle">后缀</span>
              <select id="suffix-title-select" aria-label="后缀" data-i18n-aria-label="suffixTitle"></select>
            </label>
          </div>
        </div>

        <div class="topbar-actions">
          <nav aria-label="页面操作" data-i18n-aria-label="pageActions">
            <a
              href="https://github.com/TinyKiecoo/Calculator-for-DOTA2-TI-Fantasy"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="githubRepository"
              data-i18n-aria-label="githubAria"
            >GitHub</a>
            <button type="button" id="language-toggle" aria-label="切换为英文">English</button>
            <button type="button" data-open-modal="data" data-i18n="dataNotes">数据说明</button>
          </nav>
          <div class="total-score" aria-live="polite">
            <strong id="total-score">—</strong>
          </div>
        </div>
      </header>

      <main class="banner-grid" id="banner-grid" aria-label="三面梦幻战旗" data-i18n-aria-label="bannerGrid">
        <p class="loading-message" data-i18n="loading">正在载入本地赛事数据…</p>
      </main>

      <section class="load-error" id="load-error" hidden>
        <strong data-i18n="loadErrorTitle">本地数据未能载入</strong>
        <p data-i18n="loadErrorBody">请确认 index.html、app.js、fantasy.js 与 data 文件夹保持原有相对位置。</p>
      </section>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section
      class="modal"
      id="info-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      tabindex="-1"
    >
      <header class="modal-header">
        <div>
          <span id="modal-kicker">DATA NOTES</span>
          <h2 id="modal-title" data-i18n="dataNotes">数据说明</h2>
        </div>
        <button type="button" id="modal-close" aria-label="关闭弹窗" data-i18n-aria-label="closeModal" data-i18n="close">关闭 ×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </section>
  </div>

  <noscript>
    <p class="noscript-message">此计算器需要浏览器启用 JavaScript。 / This calculator requires JavaScript.</p>
  </noscript>

  <script>
    // 修改赛事时，只需同步修改这里和 scripts/build_league.py 顶部的配置。
    const LEAGUE_ID = 19785;
    const LEAGUE_NAME = "Esports World Cup 2026";
    window.FANTASY_LEAGUE_CONFIG = { leagueId: LEAGUE_ID, leagueName: LEAGUE_NAME };
    document.write('<script src="data/' + LEAGUE_ID + '/data.js"><\/script>');
  </script>
  <script src="fantasy.js?v=20260801-stage"></script>
  <script src="app.js?v=20260804-disclaimer-wide"></script>
  <script>
    if (window.location.hostname === "www.ti-fantasy.site") {
      const busuanziScript = document.createElement("script");
      busuanziScript.src = "https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js";
      document.head.append(busuanziScript);

      fetch("https://w.saobby.com/api/visit/wb4uhqvj", {
        method: "GET",
        mode: "no-cors",
        credentials: "omit",
        cache: "no-store",
        referrerPolicy: "origin"
      }).catch(() => {});
    }
  </script>
</body>
</html>
