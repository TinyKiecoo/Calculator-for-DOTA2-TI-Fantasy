name: Update TI 2026 live data

on:
  push:
    branches:
      - main
  schedule:
    # Use one simple annual schedule so GitHub can register it reliably. The
    # job below enforces the 2026 date and Shanghai-time update window.
    # The seven-minute offset avoids GitHub's busiest cron boundaries.
    - cron: "7,22,37,52 * 13-16 8 *"
  workflow_dispatch:

concurrency:
  group: ti-2026-live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.result.outputs.should_deploy }}
    steps:
      - name: Check the 2026 update window
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            active=false
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            active=true
          else
            active="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; now = datetime.now(ZoneInfo("Asia/Shanghai")); active = now.year == 2026 and now.month == 8 and 13 <= now.day <= 16 and (10, 30) <= (now.hour, now.minute) <= (22, 10); print("true" if active else "false")')"
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.window.outputs.active == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Clarity replay parser
        if: steps.window.outputs.active == 'true'
        uses: actions/cache@v5
        with:
          path: .cache/replay-tools
          key: clarity-${{ runner.os }}-${{ hashFiles('scripts/replay_tools.py') }}

      - name: Install replay decompression support
        if: steps.window.outputs.active == 'true'
        run: python -m pip install --disable-pip-version-check zstandard

      - name: Download and parse pending TI matches
        if: steps.window.outputs.active == 'true'
        id: build
        shell: bash
        run: |
          python scripts/build_league.py \
            --league-id 19719 \
            --update-only \
            --tool-cache .cache/replay-tools

          if [[ -n "$(git status --porcelain -- data/19719/matches)" ]]; then
            changed=true
          else
            changed=false
            git restore -- data/19719 data/leagues.js
            git clean -fd -- data/19719
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit live data
        if: steps.build.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/19719 data/leagues.js
          git commit -m "Update TI 2026 live data"
          git pull --rebase origin main
          git push

      - name: Decide whether to deploy
        if: always()
        id: result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATA_CHANGED: ${{ steps.build.outputs.changed }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" || "$DATA_CHANGED" == "true" ]]; then
            should_deploy=true
          else
            should_deploy=false
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Prepare the Pages artifact
        if: steps.result.outputs.should_deploy == 'true'
        shell: bash
        run: |
          mkdir _site
          cp index.html app.js fantasy.js styles.css favicon.ico CNAME robots.txt sitemap.xml _site/
          cp -R fantasy-assets data _site/
          touch _site/.nojekyll

      - name: Upload the Pages artifact
        if: steps.result.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: update
    if: needs.update.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
